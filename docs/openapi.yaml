openapi: 3.1.0
info:
  title: Incoming Timer Sync API
  version: 1.0.0
  description: Durable multi-device timer synchronization contract.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /sync/push:
    post:
      operationId: pushTimerCommands
      summary: Apply a batch of timer commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Per-command results in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sync/pull:
    get:
      operationId: pullTimerChanges
      summary: Read changes after a durable cursor
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Ordered changes and the next cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '401': { $ref: '#/components/responses/TokenExpired' }
        '410': { $ref: '#/components/responses/CursorExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /sync/bootstrap:
    get:
      operationId: bootstrapTimers
      summary: Read the current timer snapshot and baseline cursor
      responses:
        '200':
          description: Current snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '401': { $ref: '#/components/responses/TokenExpired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /timers/{timerId}:
    get:
      operationId: getTimer
      summary: Read one timer
      parameters:
        - $ref: '#/components/parameters/TimerId'
      responses:
        '200':
          description: Timer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerRecord'
        '401': { $ref: '#/components/responses/TokenExpired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Timer does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TimerId:
      name: timerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    TokenExpired:
      description: Access token is missing or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The timer belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CursorExpired:
      description: Cursor is outside retention; bootstrap is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Request rate exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    TimerState:
      type: string
      enum: [paused, running]
    TimerRecord:
      type: object
      additionalProperties: false
      required: [id, title, durationMs, repeat, stateType, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        durationMs: { type: integer, format: int64, minimum: 1 }
        repeat: { type: boolean }
        stateType: { $ref: '#/components/schemas/TimerState' }
        remainingMs: { type: [integer, 'null'], format: int64, minimum: 0 }
        startedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    TimerCommand:
      type: object
      additionalProperties: false
      required: [operationId, timerId, deviceId, type, expectedVersion, occurredAt, payload]
      properties:
        operationId: { type: string, format: uuid }
        timerId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        type:
          type: string
          enum: [create, edit, start, pause, resume, reset, complete, delete]
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        payload: { type: object }
    PushRequest:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/TimerCommand' }
    CommandResult:
      type: object
      additionalProperties: false
      required: [operationId, status]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [applied, rejected] }
        changeSeq: { type: integer, format: int64, minimum: 1 }
        record: { $ref: '#/components/schemas/TimerRecord' }
        error: { $ref: '#/components/schemas/ErrorResponse' }
    PushResponse:
      type: object
      additionalProperties: false
      required: [results, serverTime]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/CommandResult' }
        serverTime: { type: string, format: date-time }
    Change:
      type: object
      additionalProperties: false
      required: [changeSeq, operationId, timerId, record]
      properties:
        changeSeq: { type: integer, format: int64, minimum: 1 }
        operationId: { type: string, format: uuid }
        timerId: { type: string, format: uuid }
        record: { $ref: '#/components/schemas/TimerRecord' }
    PullResponse:
      type: object
      additionalProperties: false
      required: [changes, nextCursor, hasMore, serverTime]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
        nextCursor: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        serverTime: { type: string, format: date-time }
    BootstrapResponse:
      type: object
      additionalProperties: false
      required: [timers, cursor, serverTime]
      properties:
        timers:
          type: array
          items: { $ref: '#/components/schemas/TimerRecord' }
        cursor: { type: integer, format: int64, minimum: 0 }
        serverTime: { type: string, format: date-time }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [token_expired, forbidden, not_found, version_conflict, cursor_expired, invalid_transition, rate_limited]
        message: { type: string }
        requestId: { type: string }
        latestRecord: { $ref: '#/components/schemas/TimerRecord' }
